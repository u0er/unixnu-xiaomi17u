name: Candidate A CoreEntitlements parse
on:
  push:
    branches: [codex/candidate-a-ce-parse-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: apple-oss-distributions/xnu
          ref: ac9718fb1af618d5ce8678d0dc6e8a58f252216f
          path: xnu
          persist-credentials: false
      - name: Parse isolated headers
        shell: bash
        run: bash runner/ce-parse/run.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-a-ce-parse-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/ce-parse-evidence/
