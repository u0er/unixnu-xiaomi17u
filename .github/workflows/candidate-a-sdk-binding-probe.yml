name: Candidate A SDK driver binding probe
on:
  workflow_dispatch:
  push:
    branches:
      - codex/candidate-a-sdk-binding-probe
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check SDK and compiler driver
        run: python3 -B scripts/candidate-a-sdk-binding-probe.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-a-sdk-binding-diagnostics
          path: ${{ runner.temp }}/candidate-a-sdk-binding/
          if-no-files-found: error
          retention-days: 7
