name: Candidate A chkstk isolated assembly audit

on:
  push:
    branches:
      - codex/firehose-ptrauth-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chkstk-audit:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Assemble audit-only helper
        shell: bash
        run: bash ci/chkstk-audit/build.sh
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chkstk-kernel-abi-audit-only
          path: ci/chkstk-audit/out/
          if-no-files-found: error
          retention-days: 7
